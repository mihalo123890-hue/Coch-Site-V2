<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#bg2)"/>
  <rect x="1" y="1" width="398" height="238" rx="19" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
  
  <!-- Анимированный пульсирующий круг (GIF эффект) -->
  <circle cx="200" cy="92" r="44" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="40;52;40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="92" r="38" fill="url(#playGrad)"/>
  
  <!-- Иконка Play / GIF -->
  <polygon points="193,76 215,92 193,108" fill="#18181b"/>
  
  <!-- Бейджик GIF -->
  <rect x="236" y="72" width="36" height="18" rx="5" fill="#ef4444"/>
  <text x="254" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">GIF</text>
  
  <text x="200" y="168" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="600" text-anchor="middle">ВИДЕО &amp; GIF РЕКЛАМА</text>
  <text x="200" y="192" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" text-anchor="middle">Поддерживает MP4, WebM и GIF анимации</text>
  <rect x="140" y="210" width="120" height="18" rx="9" fill="#27272a" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="200" y="223" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">СЛЕВА #2 · МЕДИА</text>
</svg>
